
name: DevOps Labs - Maven Build and Tests

on:
  push:
  pull_request:

jobs:

  lab1-build:
    name: Lab 1 - Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Lab 1
        run: mvn -B package --file Lab01/SEMCode/pom.xml

  lab6-tests:
    name: Lab 6 - JUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Lab 6 Unit Tests
        run: >
          mvn -B test
          -Dtest=AppTest
          --file Lab2/SEMCode/pom.xml

  lab7-integration-tests:
    name: Lab 7 - Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Start MySQL database
        run: docker compose up -d --build db

      - name: Wait for MySQL database
        shell: bash
        run: |
          for i in {1..60}; do
            if docker compose exec -T db \
              mysql -h 127.0.0.1 -u root -pexample \
              -N -e "SELECT 1 FROM employees.employees LIMIT 1" \
              > /dev/null 2>&1; then

              echo "MySQL employees database is ready"
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 5
          done

          echo "MySQL database did not become ready"
          docker compose logs db
          exit 1

      - name: Run Lab 7 Integration Tests
        run: >
          mvn -B test
          -Dtest=AppIntegrationTest
          --file Lab2/SEMCode/pom.xml

      - name: Stop MySQL database
        if: always()
        run: docker compose down
