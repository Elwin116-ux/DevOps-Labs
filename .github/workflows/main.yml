
name: DevOps Labs - Maven Build Tests and Deployment

on:
  push:
  pull_request:

jobs:

  # LAB 1 - MAVEN BUILD
  lab1-build:
    name: Lab 1 - Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Lab 1
        run: mvn -B package --file Lab01/SEMCode/pom.xml


  # LAB 6 - UNIT TESTS
  lab6-tests:
    name: Lab 6 - JUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Lab 6 Unit Tests
        run: >
          mvn -B test
          -Dtest=AppTest
          --file Lab2/SEMCode/pom.xml


  # LAB 7 - INTEGRATION TESTS
  lab7-integration-tests:
    name: Lab 7 - Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Start MySQL database
        run: docker compose up -d --build db

      - name: Wait for MySQL database
        shell: bash
        run: |
          for i in {1..60}; do
            if docker compose exec -T db \
              mysql -h 127.0.0.1 -u root -pexample \
              -N -e "SELECT 1 FROM employees.employees LIMIT 1" \
              > /dev/null 2>&1; then

              echo "MySQL employees database is ready"
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 5
          done

          echo "MySQL database did not become ready"
          docker compose logs db
          exit 1

      - name: Run Lab 7 Integration Tests
        run: >
          mvn -B test
          -Dtest=AppIntegrationTest
          --file Lab2/SEMCode/pom.xml

      - name: Stop MySQL database
        if: always()
        run: docker compose down


  # LAB 8 - AUTOMATED GITHUB RELEASE
  lab8-deployment:
    name: Lab 8 - Build and Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - lab1-build
      - lab6-tests
      - lab7-integration-tests

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Package Lab 8 Application
        run: >
          mvn -B package
          -DskipTests
          --file Lab2/SEMCode/pom.xml

      - name: Verify JAR Exists
        shell: bash
        run: |
          test -f Lab2/SEMCode/target/seMethods.jar
          echo "seMethods.jar successfully generated"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lab8-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" \
            Lab2/SEMCode/target/seMethods.jar \
            --target "$GITHUB_SHA" \
            --title "DevOps Lab 8 - $TAG" \
            --notes "Automated executable JAR release" \
            --latest

          echo "GitHub Release successfully published"


  # LAB 8 - AUTOMATED MARKDOWN REPORT
  lab8-reports:
    name: Lab 8 - Generate and Publish Markdown Report
    runs-on: ubuntu-latest

    needs:
      - lab1-build
      - lab6-tests
      - lab7-integration-tests

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Package Application
        run: >
          mvn -B package
          -DskipTests
          --file Lab2/SEMCode/pom.xml

      - name: Start MySQL Database
        run: docker compose up -d --build db

      - name: Wait for MySQL Database
        shell: bash
        run: |
          for i in {1..60}; do
            if docker compose exec -T db \
              mysql -h 127.0.0.1 -u root -pexample \
              -N -e "SELECT 1 FROM employees.employees LIMIT 1" \
              > /dev/null 2>&1; then

              echo "MySQL employees database is ready"
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 5
          done

          echo "MySQL database did not become ready"
          docker compose logs db
          exit 1

      - name: Build and Start Application
        shell: bash
        run: |
          docker compose up -d --build app

          APP_CONTAINER=$(docker compose ps -a -q app)

          if [ -z "$APP_CONTAINER" ]; then
            echo "Application container not found"
            exit 1
          fi

          EXIT_CODE=$(docker wait "$APP_CONTAINER")

          docker compose logs app

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Application failed with exit code $EXIT_CODE"
            exit 1
          fi

          echo "Application finished successfully"

      - name: Copy Markdown Report
        shell: bash
        run: |
          mkdir -p reports

          docker compose cp \
            app:/app/reports/SalesSalaries.md \
            ./reports/SalesSalaries.md

          test -s reports/SalesSalaries.md

          echo "Markdown report copied successfully"

      - name: Publish Reports Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: reports
          folder: reports
          clean: true
          commit-message: "Update Lab 8 Sales salary report"

      - name: Stop Docker Containers
        if: always()
        run: docker compose down
